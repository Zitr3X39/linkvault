name: Telegram sync
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 sync/tg_bot.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "LinkVault: новые ссылки из Telegram-бота"
